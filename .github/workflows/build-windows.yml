name: Build Windows

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on:      runs-on: windows-latest
      timeout-minutes: 45

      steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: "20"
            cache: npm

        - name: Install dependencies
          run: npm install --no-audit --no-fund

        - name: Ensure TT Client 26.2 jar only
          shell: pwsh
          run: |
            New-Item -ItemType Directory -Force -Path resources/bundled/variants/neoforge/26.2 | Out-Null
            if (Test-Path resources/bundled/ttclient.jar) {
              Copy-Item resources/bundled/ttclient.jar resources/bundled/variants/neoforge/26.2/ttclient.jar -Force
            }
            Get-ChildItem -Path resources/bundled/variants -Recurse -Filter ttclient.jar -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -notmatch 'neoforge[\\/]26\.2[\\/]' } |
              Remove-Item -Force
            Write-Host "Bundled jars:"
            Get-ChildItem -Path resources/bundled -Recurse -Filter *.jar | ForEach-Object { $_.FullName }

        - name: Build renderer + electron
          run: npm run build

        - name: Package Windows (NSIS + portable)
          run: npx electron-builder --win --x64 --publish never
          env:
            CSC_IDENTITY_AUTO_DISCOVERY: "false"

        - name: Upload build artifacts
          uses: actions/upload-artifact@v4
          with:
            name: TT-Launcher-Windows
            path: |
              release/*.exe
              release/*.yml
            if-no-files-found: warn
            retention-days: 30

        - name: Create GitHub Release
          if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
          uses: softprops/action-gh-release@v2
          with:
            tag_name: v${{ github.run_number }}
            name: TT Launcher build ${{ github.run_number }}
            draft: false
            prerelease: true
            files: |
              release/*.exe
            generate_release_notes: true
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          continue-on-error: true
