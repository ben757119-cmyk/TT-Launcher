name: Build Windows

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Package TT Client jars for NeoForge 26.0 / 26.1 / 26.2
        shell: pwsh
        run: |
          python scripts/package-tt-variants.py
          Get-ChildItem -Path resources/bundled -Recurse -Filter *.jar | ForEach-Object { $_.FullName + " " + $_.Length }

      - name: Build renderer + electron
        run: npm run build

      - name: Package Windows (NSIS + portable)
        run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TT-Launcher-Windows
          path: |
            release/*.exe
            release/*.yml
          if-no-files-found: warn
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: TT Launcher build ${{ github.run_number }}
          draft: false
          prerelease: true
          files: |
            release/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
